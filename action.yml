name: PipeGuard
description: Scan CI/CD pipelines and infrastructure code (Jenkinsfile, GitHub Actions, Dockerfile, Terraform) for security issues.
author: Rujuta Ekhande
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory or file to scan
    default: "."
  fail-on:
    description: Fail the step if any finding is at or above this severity (info, low, medium, high, critical)
    default: high
  sarif-file:
    description: Where to write the SARIF report (upload it with github/codeql-action/upload-sarif)
    default: pipeguard.sarif

outputs:
  sarif-file:
    description: Path of the SARIF report
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - name: Install PipeGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"
    - name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: pipeguard scan "$SCAN_PATH" --format sarif --output "$SARIF_FILE" --fail-on "$FAIL_ON" --github-summary
