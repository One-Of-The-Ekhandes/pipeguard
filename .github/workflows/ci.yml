name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: pytest
      - name: Rules documentation is up to date
        run: |
          python tools/gen_rules_doc.py
          git diff --exit-code docs/rules.md

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PipeGuard scans its own repository
        uses: ./
        with:
          fail-on: medium
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: always()
        with:
          sarif_file: pipeguard.sarif
          category: pipeguard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t pipeguard:ci .
      - name: Hardened example passes
        run: docker run --rm -v "$PWD/examples/hardened:/src:ro" pipeguard:ci scan /src --no-color
      - name: Vulnerable example fails
        run: |
          if docker run --rm -v "$PWD/examples/vulnerable:/src:ro" pipeguard:ci scan /src --no-color; then
            echo "expected findings in the vulnerable example"; exit 1
          fi
